name: Genealogy Database Validation
on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/database-validation.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/database-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-schema-and-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: alhazmi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alhazmi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGDATABASE: alhazmi_test
    steps:
      - uses: actions/checkout@v7
      - name: Prepare minimal Supabase auth compatibility for isolated tests
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table auth.users (id uuid primary key);
          create role anon nologin;
          create role authenticated nologin;
          SQL
      - name: Apply all versioned migrations in lexical order
        run: |
          set -euo pipefail
          shopt -s nullglob
          for migration in supabase/migrations/*.sql; do
            echo "Applying: $migration"
            psql -X -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Validate schema integrity and access baseline
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/schema_integrity_checks.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/advanced_permissions_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/self_service_v9_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/relational_integration.sql
