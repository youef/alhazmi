name: Neon Functions Build
on:
  push:
    paths: ['backend/neon/**','neon.ts','package.json','.github/workflows/neon-functions-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: |
          test -s dist/api/index.mjs
          test -s dist/uploads/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neon-function-bundles
          path: dist/
